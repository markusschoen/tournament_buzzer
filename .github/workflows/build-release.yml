name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: tournament-buzzer-linux
            asset_name: tournament-buzzer-linux
          - os: windows-latest
            artifact_name: tournament-buzzer-windows.exe
            asset_name: tournament-buzzer-windows.exe
          - os: macos-latest
            artifact_name: tournament-buzzer-macos.zip
            asset_name: tournament-buzzer-macos.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev portaudio19-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install portaudio

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --windowed --name tournament-buzzer main.py
          mv dist/tournament-buzzer dist/${{ matrix.artifact_name }}

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name tournament-buzzer main.py
          mv dist/tournament-buzzer.exe dist/${{ matrix.artifact_name }}

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --windowed --name "Tournament Buzzer" \
            --osx-bundle-identifier com.markusschoen.tournamentbuzzer \
            main.py
          cd dist
          zip -r tournament-buzzer-macos.zip "Tournament Buzzer.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/tournament-buzzer-linux/tournament-buzzer-linux
            artifacts/tournament-buzzer-windows.exe/tournament-buzzer-windows.exe
            artifacts/tournament-buzzer-macos.zip/tournament-buzzer-macos.zip
          generate_release_notes: true
