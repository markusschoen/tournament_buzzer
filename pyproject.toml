[project]
name = "tournament-buzzer"
version = "1.1.0"
description = "HEMA Tournament Buzzer - A customizable sound buzzer for tournament rings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "evdev>=1.9.2",
    "loguru>=0.7.3",
    "numpy>=2.3.5",
    "pynput>=1.8.1",
    "sounddevice>=0.5.3",
]

[project.optional-dependencies]
dev = [
    "codespell>=2.4.1",
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "ruff>=0.14.7",
    "pyinstaller>=6.0.0",
]

linux = [
    "evdev>=1.0.3",
]

[project.scripts]
tournament-buzzer = "tournament_buzzer.app:main"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
